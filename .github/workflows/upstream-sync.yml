name: Sync Rust upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Sync Rust core from upstream
        run: ./scripts/sync-rust-upstream.sh

      - name: Check Rust core for the host
        run: cargo check --manifest-path src-wrapper/Cargo.toml --locked

      # Требует xcrun и iOS SDK, поэтому job живёт на macOS-раннере.
      - name: Check Rust core for iOS
        run: cargo check --manifest-path src-wrapper/Cargo.toml --locked --target aarch64-apple-ios

      - name: FFI smoke test
        run: ./scripts/run-ffi-smoke.sh

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/rust-upstream
          delete-branch: true
          add-paths: |
            src-wrapper
            vendor/tg-ws-proxy-android
          commit-message: "chore: sync Rust upstream"
          title: "chore: sync Rust upstream"
          body: |
            Автоматическая еженедельная синхронизация Rust-ядра из `amurcanov/tg-ws-proxy-android`.

            Патч `scripts/patches/ios-ffi.patch` наложен заново, ядро проверено для хоста
            и для `aarch64-apple-ios`, FFI-контракт прогнан смоук-тестом.
