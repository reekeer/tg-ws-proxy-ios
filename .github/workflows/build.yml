name: Build iOS IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check core
        run: cargo check --manifest-path src-wrapper/Cargo.toml --locked

      # Сборку под aarch64-apple-ios проверяет job app: xcodebuild собирает
      # ядро через build-rust-ios.sh, для этого нужен iOS SDK и macOS-раннер.
      - name: FFI smoke test
        run: ./scripts/run-ffi-smoke.sh

  app:
    name: ${{ matrix.name }}
    runs-on: macos-15
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          # Без entitlements: ставится с любым Apple ID, в фоне держится
          # через CoreLocation.
          - name: free
            flags: ""
          # С Network Extension: нужен profile с packet-tunnel-provider.
          - name: vpn
            flags: "--vpn"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build IPA
        run: ./build.sh ${{ matrix.flags }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TgWsProxy-${{ matrix.name }}
          path: dist/TgWsProxy-${{ matrix.name }}.ipa
          if-no-files-found: error
