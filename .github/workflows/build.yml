name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update Rust Core from Upstream
        run: |
          git submodule update --remote --merge || true

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'
      - name: Patch GlassEffect and Inject Silent Audio Engine
        run: |
          # 1. Вырезаем баг эффекта стекла
          sed -i '' 's/\.glassEffect.*//g' ios/TgWsProxy/UI/GlassTheme.swift
          
          # 2. Вшиваем в Info.plist фоновый режим аудио (декларация для Apple)
          plutil -insert UIBackgroundModes -array ios/TgWsProxy/Info.plist || true
          plutil -insert UIBackgroundModes.0 -string "audio" ios/TgWsProxy/Info.plist || true
          
          # 3. ХАК: Автоматический поиск главной точки входа и внедрение генератора тишины
          cat << 'EOF' > patch_audio.py
          import os

          # Код хака на Swift (Генератор тишины через AVAudioEngine + Авторестарт)
          audio_code = """
          import AVFoundation

          class SilentAudioEngine {
              static let shared = SilentAudioEngine()
              private var engine = AVAudioEngine()
              private var observer: Any?
              
              init() {
                  // Слушаем прерывания (звонки, голосовые, использование микрофона)
                  observer = NotificationCenter.default.addObserver(
                      forName: AVAudioSession.interruptionNotification,
                      object: nil,
                      queue: nil
                  ) { [weak self] notification in
                      guard let self = self,
                            let userInfo = notification.userInfo,
                            let typeValue = userInfo[AVAudioSessionInterruptionTypeKey] as? UInt,
                            let type = AVAudioSession.InterruptionType(rawValue: typeValue) else { return }
                      
                      // Если прерывание закончилось, перезапускаем аудио движок
                      if type == .ended {
                          try? AVAudioSession.sharedInstance().setActive(true)
                          try? self.engine.start()
                      }
                  }
              }
              
              func start() {
                  let session = AVAudioSession.sharedInstance()
                  try? session.setCategory(.playback, mode: .default, options: [.mixWithOthers])
                  try? session.setActive(true)
                  
                  let srcNode = AVAudioSourceNode { _, _, frameCount, audioBufferList -> OSStatus in
                      let ablPointer = UnsafeMutableAudioBufferListPointer(audioBufferList)
                      for buffer in ablPointer {
                          memset(buffer.mData, 0, Int(buffer.mDataByteSize))
                      }
                      return noErr
                  }
                  
                  engine.attach(srcNode)
                  engine.connect(srcNode, to: engine.mainMixerNode, format: nil)
                  try? engine.start()
              }
              
              deinit {
                  if let observer = observer {
                      NotificationCenter.default.removeObserver(observer)
                  }
              }
          }
          """

          app_file = None
          # Ищем файл с главной точкой входа SwiftUI во всем проекте ios/
          for root, dirs, files in os.walk("ios"):
              for file in files:
                  if file.endswith(".swift"):
                      path = os.path.join(root, file)
                      with open(path, "r", errors="ignore") as f:
                          content = f.read()
                          if "@main" in content and "some Scene" in content:
                              app_file = path
                              print(f"Found main app file at: {app_file}")
                              break
              if app_file:
                  break

          if not app_file:
              print("ERROR: Could not find main SwiftUI app file!")
              exit(1)

          with open(app_file, "r") as f:
              content = f.read()

          # Вставляем импорт и класс в начало найденного файла
          content = audio_code + "\n" + content
          
          # Встраиваем запуск плеера в инициализатор
          if "init(" in content:
              content = content.replace("init(", "init() {\n        SilentAudioEngine.shared.start()\n    }\n    // patched init(")
          else:
              content = content.replace("var body: some Scene {", "init() {\n        SilentAudioEngine.shared.start()\n    }\n    var body: some Scene {")

          with open(app_file, "w") as f:
              f.write(content)
          print("Silent Audio Engine successfully injected into Swift!")
          EOF
          
          python3 patch_audio.py

      - name: Install Rust iOS Target
        run: rustup target add aarch64-apple-ios

      - name: Make script executable
        run: chmod +x build.sh

      - name: Run Build Script
        env:
          OTHER_SWIFT_FLAGS: "-strict-concurrency=minimal -suppress-warnings"
        run: ./build.sh -p side -c la

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-sideload
          path: dist/*.ipa
