name: Build iOS IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Check core for the host
        run: cargo check --manifest-path src-wrapper/Cargo.toml --locked

      - name: Check core for iOS
        run: cargo check --manifest-path src-wrapper/Cargo.toml --locked --target aarch64-apple-ios

      - name: FFI smoke test
        run: ./scripts/run-ffi-smoke.sh

  app:
    name: ${{ matrix.name }}
    runs-on: macos-15
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          # Без entitlements: ставится с любым Apple ID, в фоне держится
          # через CoreLocation.
          - name: sideload-free
            components: none
          # Полный набор: нужен profile с Network Extension и App Groups.
          - name: sideload-full
            components: wd,la,cc,vpn
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build IPA
        run: ./build.sh -p side -c ${{ matrix.components }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-${{ matrix.name }}
          path: dist/*.ipa
          if-no-files-found: error
